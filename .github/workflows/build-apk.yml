# Optional: build the APK on GitHub (no Flutter needed on your PC).
# Push this folder to a private GitHub repository.
# Every push to main builds it (or Actions > "Build APK" > Run workflow). Two APKs
# appear under the run's Artifacts: TEST (debug, allows local http:// Odoo) and RELEASE.
#
# For release signing (needed so updates install over the old app), add these
# repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Without them the APK is signed with a temporary debug key (testing only).
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      # Test APK: can also reach a local http:// Odoo (e.g. http://192.168.1.10:8069)
      - run: flutter build apk --debug
      # Release APK for staff: https only
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: veevee-field-locator-TEST-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: veevee-field-locator-RELEASE-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
